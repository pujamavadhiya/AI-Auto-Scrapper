services:
  - type: web
    name: ai-auto-scrapper-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: INITIAL_USERS
        value: ketan@gmail.com:Ketan@1234:Ketan:user,deep@gmail.com:Deep@1234:Deep:user
      - key: SERPAPI_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LEADOCEAN_API_KEY
        sync: false
